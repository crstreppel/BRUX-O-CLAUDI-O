<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login • PBQE-C V2</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body class="page page-auth">
<div class="auth-wrapper">
<div class="auth-card">

  <!-- Campos isca para AUTOFILL agressivo (Chrome / Password Manager) -->
  <input type="text" style="display:none">
  <input type="password" style="display:none">

  <header class="auth-header">
    <h1 class="auth-title">Entrar</h1>
    <p class="auth-subtitle">Faça login para acessar o Sistema Central</p>
  </header>

  <form id="formLogin" class="auth-form" autocomplete="off">
    <div class="form-group">
      <label for="loginEmail">E-mail</label>
      <input
        id="loginEmail"
        name="login_identifier"
        type="email"
        autocomplete="off"
        readonly
        onfocus="this.removeAttribute('readonly')"
        required
      >
    </div>

    <div class="form-group">
      <label for="loginSenha">Senha</label>
      <input
        id="loginSenha"
        name="login_secret"
        type="password"
        autocomplete="off"
        readonly
        onfocus="this.removeAttribute('readonly')"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary btn-full">
      Entrar
    </button>
  </form>

  <div id="msgLogin" class="auth-message" aria-live="polite"></div>

  <section class="auth-extra">
    <a href="/modules/reset_senha/reset_senha.html" class="btn btn-text">
      Alterar / Recuperar senha
    </a>
    <a href="/modules/cadastro/cadastro.html" class="btn btn-text">
      Criar conta
    </a>
    <a href="/modules/confirmacao/confirmacao.html" class="btn btn-text">
      Confirmar e-mail
    </a>
  </section>

</div>
</div>

<script src="/modules/shared/session.js"></script>
<script src="/modules/shared/api.js"></script>
<script src="login.js"></script>
</body>
</html>
